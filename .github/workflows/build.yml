name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older running build, so `builds` never gets overwritten by a stale one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      # GameInput API v2 header (the game uses GameInput v2); Microsoft.GameInput 2.2.26100.6114 from nuget.org,
      # not vendored in the repo. deps/ is git-ignored.
      - name: Fetch GameInput v2 header
        shell: pwsh
        run: |
          $u = "https://api.nuget.org/v3-flatcontainer/microsoft.gameinput/2.2.26100.6114/microsoft.gameinput.2.2.26100.6114.nupkg"
          Invoke-WebRequest -Uri $u -OutFile gameinput.zip
          Expand-Archive gameinput.zip -DestinationPath gameinput-pkg -Force
          New-Item -ItemType Directory -Force deps/gameinput-v2 | Out-Null
          Copy-Item gameinput-pkg/native/include/GameInput.h deps/gameinput-v2/GameInput.h
          Select-String -Path deps/gameinput-v2/GameInput.h -Pattern 'GAMEINPUT_API_VERSION 2' | Select-Object -First 1

      # LyricsFlow port: compile shaders/glyph.hlsl with the Windows SDK's dxc (signs via dxil.dll) -> src/GlyphShaders.h
      - name: Compile glyph shader (dxc)
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter dxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Output "::error::dxc.exe not found in the Windows SDK"; exit 1 }
          Write-Output "dxc: $($dxc.FullName)"
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { Write-Output "::error::fxc.exe not found in the Windows SDK"; exit 1 }
          Write-Output "fxc: $($fxc.FullName)"
          python tools/gen_glyph.py "$($dxc.FullName)" "$($fxc.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/gen_postfx.py "$($dxc.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/gen_glassarmor.py "$($dxc.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/gen_screen.py "$($dxc.FullName)" "$($fxc.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - run: xmake repo -u
      - run: xmake f -a x64 -m release -p windows -v -y --target_type=client
      - name: Build
        shell: pwsh
        run: |
          xmake -v -y 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # surface compiler errors as annotations (readable without downloading logs)
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 25 | ForEach-Object {
              $m = $_.Line -replace '%','%25' -replace "`r",'' -replace "`n",' '
              if ($m.Length -gt 900) { $m = $m.Substring(0, 900) }
              Write-Output "::error::$m"
            }
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RendererFoundation-client-windows-x64-${{ github.sha }}
          path: bin/

      - name: Publish build to the builds branch
        if: github.ref == 'refs/heads/renderer-foundation' && github.event_name == 'push'
        shell: bash
        run: |
          grep -q '"platform": "client"' bin/RendererFoundation/manifest.json || { echo 'manifest platform not client'; cat bin/RendererFoundation/manifest.json; exit 1; }
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/
          cd out
          git init -q -b rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" rf-builds

      # Spatial GUI M0 spike: publish to its own branch (artifact downloads are blocked from the PC's network;
      # git works). rf-builds stays the installed RF.
      - name: Publish spike build to spatialgui-m0-builds
        if: github.ref == 'refs/heads/spatialgui-m0' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/
          cd out
          git init -q -b spatialgui-m0-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" spatialgui-m0-builds

      # Cinematic Interactions (merged into the Spatial GUI mod): its own builds branch
      - name: Publish cinematic build to cinematic-builds
        if: github.ref == 'refs/heads/cinematic' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/
          cd out
          git init -q -b cinematic-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" cinematic-builds

      # LyricsFlow prep (cinematic + lyrics pass): own branch so cinematic-builds / rf-builds stay untouched
      - name: Publish client UI RF build to clientui-rf-builds
        if: github.ref == 'refs/heads/clientui/rf' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/
          cd out
          git init -q -b clientui-rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" clientui-rf-builds

      - name: Publish LyricsFlow RF build to lyricsflow-rf-builds
        if: startsWith(github.ref, 'refs/heads/lyricsflow/rf-on-cinematic') && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/ && cp src/GlyphShaders.h out/ && (cp src/SkyShaders.h out/ || true)
          cd out
          git init -q -b lyricsflow-rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" lyricsflow-rf-builds

      # LyricsFlow on Direct3D 11 (Blueberry compatibility): own builds branch so lyricsflow-rf-builds stays untouched
      - name: Publish D3D11 RF build to lyricsflow-rf-d3d11-builds
        if: github.ref == 'refs/heads/lyricsflow/rf-d3d11' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/ && cp src/GlyphShaders.h out/
          cd out
          git init -q -b lyricsflow-rf-d3d11-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" lyricsflow-rf-d3d11-builds

      # Cinematic LyricsForge work (pairs with Bedrock Forge lyricsforge-cinematic/bf): own builds branch
      - name: Publish cinematic RF build to lyricsforge-cinematic-rf-builds
        if: github.ref == 'refs/heads/lyricsforge-cinematic/rf' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/ && cp src/GlyphShaders.h out/
          cd out
          git init -q -b lyricsforge-cinematic-rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" lyricsforge-cinematic-rf-builds
      # Glass Armor (M0 probe on top of the live RF line): own builds branch, installed RF stays untouched
      - name: Publish glass armor RF build to glass-armor-rf-builds
        if: github.ref == 'refs/heads/glass-armor/rf' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/ && cp src/GlyphShaders.h out/
          cd out
          git init -q -b glass-armor-rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" glass-armor-rf-builds
      # World FX (M0 world probe on top of the live RF line): own builds branch, installed RF stays untouched
      - name: Publish World FX RF build to worldfx-rf-builds
        if: github.ref == 'refs/heads/worldfx/rf' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p out && cp -r bin/* out/ && cp LICENSE NOTICE.md README.md out/ && cp src/GlyphShaders.h out/
          cd out
          git init -q -b worldfx-rf-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" worldfx-rf-builds
