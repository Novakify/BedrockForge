name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older running build, so `builds` never gets overwritten by a stale one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: xmake repo -u
      - run: xmake f -a x64 -m release -p windows -v -y --target_type=client
      - name: Build
        shell: pwsh
        run: |
          xmake -v -y 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # surface compiler errors as annotations (readable without downloading logs)
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 25 | ForEach-Object {
              $m = $_.Line -replace '%','%25' -replace "`r",'' -replace "`n",' '
              if ($m.Length -gt 900) { $m = $m.Substring(0, 900) }
              Write-Output "::error::$m"
            }
            exit $code
          }

      - name: LyricsFlow core unit tests (clang-cl)
        shell: pwsh
        run: |
          xmake build -v -y LyricsCoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake run LyricsCoreTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 tools, docs) {
            $errs = $null; [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 } else { Write-Host "PowerShell scripts OK" }

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockForgeCore-client-windows-x64-${{ github.sha }}
          path: bin/

      - name: Publish build to the builds branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          grep -q '"platform": "client"' bin/BedrockForgeCore/manifest.json || { echo 'manifest platform not client'; cat bin/BedrockForgeCore/manifest.json; exit 1; }
          mkdir -p out && cp -r bin/* out/ && cp -r packs out/packs && cp tools/Install-BedrockForge.ps1 out/
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds

      # LyricsFlow prep branch: publish the BF DLL + lyrics resources to `lyricsflow-builds` (artifact downloads are
      # blocked on the PC's network; git works). `builds` (main) is untouched.
      - name: Publish LyricsFlow build to lyricsflow-builds
        if: github.ref == 'refs/heads/lyricsflow/scaffold' && github.event_name == 'push'
        shell: bash
        run: |
          grep -q '"platform": "client"' bin/BedrockForgeCore/manifest.json || { echo 'manifest platform not client'; exit 1; }
          mkdir -p out && cp -r bin/* out/
          mkdir -p out/BedrockForgeCore/resources && cp -r resources/lyricsflow out/BedrockForgeCore/resources/lyricsflow
          cp -r third_party/lyricsflow out/BedrockForgeCore/resources/lyricsflow/licenses
          mkdir -p out/packs && cp -r packs/LyricsFlowGlassHotbar out/packs/
          cd out
          git init -q -b lyricsflow-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" lyricsflow-builds

      # Glass client menu branch: same payload as lyricsflow-builds + resources/client (icon atlas)
      - name: Publish client UI build to clientui-builds
        if: github.ref == 'refs/heads/clientui/bf' && github.event_name == 'push'
        shell: bash
        run: |
          grep -q '"platform": "client"' bin/BedrockForgeCore/manifest.json || { echo 'manifest platform not client'; exit 1; }
          mkdir -p out && cp -r bin/* out/
          mkdir -p out/BedrockForgeCore/resources && cp -r resources/lyricsflow out/BedrockForgeCore/resources/lyricsflow
          cp -r resources/client out/BedrockForgeCore/resources/client
          cp -r third_party/lyricsflow out/BedrockForgeCore/resources/lyricsflow/licenses
          mkdir -p out/packs && cp -r packs/LyricsFlowGlassHotbar out/packs/
          cd out
          git init -q -b clientui-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u +%F)" > BUILD_INFO.txt
          git add -A && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" clientui-builds

  # LyricsFlow port: the pure core (src/lyrics/core) + its tests also build and run on Linux (gcc), so parser/placement
  # regressions show up even when the Windows/LeviLamina build is busy or broken for unrelated reasons.
  lyrics-core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Build + run LyricsCoreTests
        run: |
          xmake f -p linux -m debug -y
          xmake build -v -y LyricsCoreTests
          xmake run LyricsCoreTests

